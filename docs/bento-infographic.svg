<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 856" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="flagship-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfe4ff" />
      <stop offset="50%" stop-color="#e2d6ff" />
      <stop offset="100%" stop-color="#ffd9ec" />
    </linearGradient>
    <linearGradient id="flagship-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a78d6" />
      <stop offset="55%" stop-color="#8a5cf6" />
      <stop offset="100%" stop-color="#e0578a" />
    </linearGradient>
    <linearGradient id="tile16-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12203b" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <radialGradient id="tile16-glow" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#3987e5" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#3987e5" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="chip-ts" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3987e5" />
      <stop offset="100%" stop-color="#1c5cab" />
    </linearGradient>
    <radialGradient id="fm-glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#9085e9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2a1f45" stop-opacity="1" />
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.07" />
    </filter>
  </defs>

  <!--
    Type scale (used identically everywhere, no other sizes appear):
      KICKER      14px / 700 / letter-spacing 1.5 / uppercase — clarifies a glyph
      TITLE       22px / 800 — every tile's primary caption
      DETAIL      16px / 600 — secondary line under a TITLE
      HERO-GLYPH  80px / 800 — the four "spec number" tiles (16, 19, 100, AF)
      CHIP-GLYPH  28px / 800 — the two small badge tiles (TypeScript, Framer Motion)
      DISPLAY     40px / 800 — the single flagship headline (the one showcase tile)
    Outline (every tile, no exceptions):
      light background → stroke #000 at 8% / 1.5px
      dark background   → stroke #fff at 14% / 1.5px
    Icons: centered hero icons use 5px main / 4px detail stroke; corner icons use 4px / 3px.
  -->

  <rect x="0" y="0" width="1500" height="856" fill="#f5f5f7" />

  <!-- ============ ROW 1 ============ -->

  <!-- A: Accessibility -->
  <rect x="24" y="24" width="210" height="190" rx="28" fill="#ddf6df" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" filter="url(#soft-shadow)" />
  <circle cx="129" cy="78" r="26" fill="none" stroke="#1ba64c" stroke-width="5" />
  <path d="M 116 78 L 125 87 L 144 66" fill="none" stroke="#1ba64c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="129" y="148" text-anchor="middle" font-size="22" font-weight="800" fill="#0b2e15">100/100</text>
  <text x="129" y="176" text-anchor="middle" font-size="22" font-weight="800" fill="#0b2e15">Accessibility</text>

  <!-- B: Bilingual -->
  <rect x="250" y="24" width="140" height="190" rx="28" fill="#eeeef0" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" filter="url(#soft-shadow)" />
  <circle cx="320" cy="78" r="26" fill="none" stroke="#1d1d1f" stroke-width="5" />
  <ellipse cx="320" cy="78" rx="10" ry="26" fill="none" stroke="#1d1d1f" stroke-width="4" />
  <path d="M 294 78 L 346 78" stroke="#1d1d1f" stroke-width="4" />
  <text x="320" y="162" text-anchor="middle" font-size="22" font-weight="800" fill="#1d1d1f">EN / GR</text>

  <!-- C: Next.js 16 -->
  <rect x="406" y="24" width="210" height="190" rx="28" fill="#eeeef0" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" filter="url(#soft-shadow)" />
  <rect x="422" y="40" width="178" height="158" rx="32" fill="url(#tile16-bg)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5" />
  <rect x="422" y="40" width="178" height="158" rx="32" fill="url(#tile16-glow)" />
  <text x="511" y="68" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.5" fill="#ffffff" fill-opacity="0.55">NEXT.JS</text>
  <text x="511" y="160" text-anchor="middle" font-size="80" font-weight="800" fill="#ffffff">16</text>

  <!-- D: Performance -->
  <rect x="632" y="24" width="210" height="190" rx="28" fill="#eeeef0" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" filter="url(#soft-shadow)" />
  <path d="M 703 100 A 34 34 0 0 1 771 100" fill="none" stroke="#1d1d1f" stroke-width="5" stroke-linecap="round" />
  <path d="M 737 100 L 722 78" stroke="#e34948" stroke-width="4" stroke-linecap="round" />
  <circle cx="737" cy="100" r="6" fill="#1d1d1f" />
  <text x="737" y="148" text-anchor="middle" font-size="22" font-weight="800" fill="#1d1d1f">Fast by</text>
  <text x="737" y="176" text-anchor="middle" font-size="22" font-weight="800" fill="#1d1d1f">design</text>

  <!-- E: Flagship (the one display-scale exception, same treatment as the reference's single hero tile) -->
  <rect x="858" y="24" width="430" height="190" rx="28" fill="url(#flagship-bg)" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" filter="url(#soft-shadow)" />
  <text x="1073" y="108" text-anchor="middle" font-size="40" font-weight="800" fill="url(#flagship-text)">Horizontal</text>
  <text x="1073" y="156" text-anchor="middle" font-size="40" font-weight="800" fill="url(#flagship-text)">Scroll Journey</text>

  <!-- F: Brand mark -->
  <rect x="1304" y="24" width="172" height="190" rx="28" fill="#1d1d1f" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5" filter="url(#soft-shadow)" />
  <text x="1390" y="147" text-anchor="middle" font-size="80" font-weight="800" fill="#ffffff" letter-spacing="2">AF</text>

  <!-- ============ ROW 2 ============ -->

  <!-- G: React 19 -->
  <rect x="24" y="230" width="210" height="190" rx="28" fill="#eeeef0" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" filter="url(#soft-shadow)" />
  <text x="129" y="274" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.5" fill="#6e6e73">REACT</text>
  <text x="129" y="364" text-anchor="middle" font-size="80" font-weight="800" fill="#1d1d1f">19</text>

  <!-- H: TypeScript -->
  <rect x="250" y="230" width="140" height="190" rx="28" fill="#14151a" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5" filter="url(#soft-shadow)" />
  <text x="320" y="274" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#ffffff" fill-opacity="0.55">TYPESCRIPT</text>
  <rect x="292" y="300" width="56" height="56" rx="14" fill="url(#chip-ts)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5" />
  <text x="320" y="338" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">5</text>

  <!-- K: Keyboard / a11y toolkit -->
  <rect x="858" y="230" width="618" height="190" rx="28" fill="#eeeef0" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" filter="url(#soft-shadow)" />
  <text x="886" y="272" font-size="22" font-weight="800" fill="#1d1d1f">Full keyboard navigation</text>
  <g font-size="14" font-weight="700" fill="#1d1d1f">
    <rect x="886" y="300" width="64" height="56" rx="14" fill="#ffffff" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" />
    <text x="918" y="333" text-anchor="middle">TAB</text>
    <rect x="962" y="300" width="64" height="56" rx="14" fill="#ffffff" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" />
    <text x="994" y="333" text-anchor="middle">←</text>
    <rect x="1038" y="300" width="64" height="56" rx="14" fill="#3987e5" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5" />
    <text x="1070" y="333" text-anchor="middle" fill="#ffffff">→</text>
    <rect x="1114" y="300" width="64" height="56" rx="14" fill="#ffffff" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" />
    <text x="1146" y="333" text-anchor="middle">ESC</text>
    <rect x="1190" y="300" width="64" height="56" rx="14" fill="#ffffff" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" />
    <text x="1222" y="333" text-anchor="middle">↵</text>
    <rect x="1266" y="300" width="68" height="56" rx="14" fill="#ffffff" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" />
    <text x="1300" y="333" text-anchor="middle">FOCUS</text>
  </g>

  <!-- ============ ROW 3 ============ -->

  <!-- I: Framer Motion (spans col1+2) -->
  <rect x="24" y="436" width="366" height="190" rx="28" fill="#1a1030" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5" filter="url(#soft-shadow)" />
  <rect x="24" y="436" width="366" height="190" rx="28" fill="url(#fm-glow)" />
  <text x="207" y="472" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#ffffff" fill-opacity="0.6">FRAMER MOTION</text>
  <rect x="165" y="500" width="84" height="84" rx="20" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />
  <text x="207" y="552" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">12</text>

  <!-- J: Center visual — the site itself -->
  <rect x="406" y="230" width="436" height="396" rx="28" fill="#ffffff" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" filter="url(#soft-shadow)" />
  <rect x="438" y="262" width="372" height="292" rx="20" fill="#0d0d0d" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5" />
  <circle cx="462" cy="286" r="6" fill="#e34948" />
  <circle cx="482" cy="286" r="6" fill="#eda100" />
  <circle cx="502" cy="286" r="6" fill="#1baf7a" />
  <text x="624" y="392" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="3" fill="#ffffff">ANDREAS</text>
  <text x="624" y="418" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="3" fill="#ffffff">FRAGKIADAKIS</text>
  <path d="M 580 460 L 596 460 M 585 454 L 579 460 L 585 466 M 668 460 L 652 460 M 663 454 L 669 460 L 663 466" stroke="#3987e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <g>
    <circle cx="594" cy="500" r="5" fill="#3987e5" />
    <circle cx="612" cy="500" r="5" fill="#ffffff" fill-opacity="0.3" />
    <circle cx="630" cy="500" r="5" fill="#ffffff" fill-opacity="0.3" />
    <circle cx="648" cy="500" r="5" fill="#ffffff" fill-opacity="0.3" />
    <circle cx="666" cy="500" r="5" fill="#ffffff" fill-opacity="0.3" />
    <circle cx="684" cy="500" r="5" fill="#ffffff" fill-opacity="0.3" />
  </g>
  <text x="624" y="600" text-anchor="middle" font-size="16" font-weight="600" fill="#6e6e73">andreas.technology</text>

  <!-- L: Lighthouse score -->
  <rect x="858" y="436" width="618" height="190" rx="28" fill="#eeeef0" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" filter="url(#soft-shadow)" />
  <text x="1167" y="472" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.5" fill="#6e6e73">LIGHTHOUSE SCORE</text>
  <text x="1167" y="586" text-anchor="middle" font-size="80" font-weight="800" fill="#1d1d1f">100</text>

  <!-- ============ ROW 4 (bottom strip) ============ -->

  <!-- BT1: SEO -->
  <rect x="24" y="642" width="404" height="190" rx="28" fill="#eeeef0" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" filter="url(#soft-shadow)" />
  <circle cx="68" cy="682" r="16" fill="none" stroke="#1d1d1f" stroke-width="4" />
  <path d="M 79 693 L 90 704" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round" />
  <text x="52" y="764" font-size="22" font-weight="800" fill="#1d1d1f">SEO built in</text>
  <text x="52" y="792" font-size="16" font-weight="600" fill="#6e6e73">JSON-LD · dynamic OG images · sitemap</text>

  <!-- BT2: Reduced motion -->
  <rect x="444" y="642" width="298" height="190" rx="28" fill="#eeeef0" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" filter="url(#soft-shadow)" />
  <path d="M 563 696 Q 573 676 583 696 T 603 696 T 623 696" fill="none" stroke="#1d1d1f" stroke-width="5" stroke-linecap="round" />
  <line x1="558" y1="676" x2="628" y2="716" stroke="#e34948" stroke-width="4" stroke-linecap="round" />
  <text x="593" y="766" text-anchor="middle" font-size="22" font-weight="800" fill="#1d1d1f">Reduced-motion</text>
  <text x="593" y="794" text-anchor="middle" font-size="22" font-weight="800" fill="#1d1d1f">support</text>

  <!-- BT3: Skip links / aria-live -->
  <rect x="758" y="642" width="298" height="190" rx="28" fill="#ddf6df" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" filter="url(#soft-shadow)" />
  <circle cx="907" cy="696" r="26" fill="none" stroke="#1ba64c" stroke-width="5" />
  <path d="M 894 696 L 903 705 L 922 682" fill="none" stroke="#1ba64c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="907" y="766" text-anchor="middle" font-size="22" font-weight="800" fill="#0b2e15">Skip links &amp;</text>
  <text x="907" y="794" text-anchor="middle" font-size="22" font-weight="800" fill="#0b2e15">aria-live</text>

  <!-- BT4: Playful micro-UI -->
  <rect x="1072" y="642" width="404" height="190" rx="28" fill="#eeeef0" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5" filter="url(#soft-shadow)" />
  <g transform="translate(1106,670) scale(1.3)">
    <path d="M 0 0 L 0 20 L 5 15.5 L 9 24 L 13 22 L 9 13.5 L 16 13.5 Z" fill="#1d1d1f" />
  </g>
  <circle cx="1118" cy="701" r="3" fill="#3987e5" />
  <text x="1100" y="764" font-size="22" font-weight="800" fill="#1d1d1f">Playful micro-UI</text>
  <text x="1100" y="792" font-size="16" font-weight="600" fill="#6e6e73">Blob cursor · spotlight cards</text>
  <text x="1100" y="812" font-size="16" font-weight="600" fill="#6e6e73">logo loop</text>
</svg>
